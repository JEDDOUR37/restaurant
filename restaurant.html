<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { min-height: 100vh; font-family: Georgia, serif; color: #f4ead8; text-align: center; background: #120c08; }
h1 { font-size: 2.3rem; letter-spacing: 2px; color: #d8b25a; }
.nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
  padding: .7rem 1.5rem; background: rgba(18,12,8,.95); border-bottom: 1px solid rgba(216,178,90,.25); }
.brand { display: flex; align-items: center; gap: .6rem; color: #d8b25a; text-decoration: none; font-size: 1.2rem; }
.brand img { width: 44px; }
.nav nav { display: flex; gap: 1.4rem; }
.nav nav a { color: #f4ead8; text-decoration: none; }

.hero2 { padding: 6rem 1rem 5rem; background: radial-gradient(circle at 50% 0, #4a2d1b, #120c08 70%); }
.hero2 h1 { font-size: 3.2rem; }
.hero2 p { margin: .8rem 0 1.6rem; opacity: .85; }
.btn { display: inline-block; background: #d8b25a; color: #2a1a0c; padding: .8rem 1.8rem; border-radius: 30px; text-decoration: none; font-weight: bold; }
.bloc { max-width: 1000px; margin: 0 auto; padding: 3.5rem 1rem; scroll-margin-top: 80px; }
.bloc h2, footer h2 { color: #d8b25a; font-size: 2rem; margin-bottom: 1.2rem; }
.tabs { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin: 1rem 0 1.5rem; }
.tab { display: flex; align-items: center; gap: .5rem; padding: .5rem .9rem; border-radius: 30px; border: 1px solid rgba(255,255,255,.2);
  background: transparent; color: inherit; font: inherit; cursor: pointer; transition: background .3s; }
.tab img { width: 26px; height: 18px; object-fit: cover; border-radius: 3px; }
.tab.on { background: var(--c); border-color: var(--c); }
#slogan { opacity: .85; margin-bottom: 1rem; font-style: italic; }
#carte { max-width: 1100px; }
.banner { display: flex; align-items: center; gap: 1.2rem; justify-content: center; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 18px; background: linear-gradient(120deg, var(--c), #1f1510 90%); text-align: left; scroll-margin-top: 80px; }
.banner img { width: 120px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.banner h3 { font-size: 2.2rem; color: #fff; }
.banner p { opacity: .9; font-style: italic; }
.plats { display: grid; gap: 1.8rem; margin: 1.5rem auto; }
.plat { display: grid; grid-template-columns: 1.1fr 1fr; background: #1f1510; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; overflow: hidden; text-align: left; opacity: 0; animation: up .6s forwards; animation-delay: var(--d); }
.plat:nth-child(even) .photo { order: 2; }
.photo { position: relative; min-height: 320px; background: linear-gradient(135deg, var(--c), #2a170d); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .emoji { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: 6rem; }
.photo.nophoto .emoji { display: flex; }
.credit { position: absolute; right: 8px; bottom: 6px; font-size: .7rem; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 6px; }
.txt { padding: 1.6rem; display: flex; flex-direction: column; gap: .6rem; }
.plat h3 { font-size: 1.7rem; color: #f0d98a; }
.plat p { opacity: .85; }
.story { margin-top: .4rem; padding: .9rem 1rem; border-left: 3px solid var(--c); background: rgba(255,255,255,.05); border-radius: 0 10px 10px 0; font-style: italic; }
.story b { display: block; font-style: normal; color: #d8b25a; margin-bottom: .3rem; }
@media (max-width: 760px) { .plat { grid-template-columns: 1fr; } .plat:nth-child(even) .photo { order: 0; } .photo { min-height: 220px; } .banner { flex-direction: column; text-align: center; } }
.bas { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
.prix { font-weight: bold; font-size: 1.1rem; }
.bas button { background: var(--c, #d8b25a); color: #fff; border: 0; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; }
.offres { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
.offre { background: #1f1510; border: 1px solid rgba(216,178,90,.25); border-radius: 14px; padding: 1.4rem; scroll-margin-top: 80px; }
.offre b { display: block; font-size: 2rem; }
.offre h3 { color: #f0d98a; margin: .5rem 0 .3rem; }
.offre p { opacity: .75; font-size: .92rem; }
footer { padding: 2.5rem 1rem; border-top: 1px solid rgba(216,178,90,.25); }
footer p { margin: .3rem 0; }
button.btn { border: 0; cursor: pointer; font: inherit; font-weight: bold; }
.cartbtn { background: #d8b25a; color: #2a1a0c; border: 0; border-radius: 20px; padding: .5rem 1rem; font: inherit; font-weight: bold; cursor: pointer; }
.drawer { position: fixed; top: 0; right: 0; width: min(380px, 100vw); height: 100%; background: #1a110c; border-left: 1px solid rgba(216,178,90,.4); z-index: 30; padding: 1.2rem; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .4s; text-align: left; }
.drawer.open { transform: none; }
.drawer h2 { color: #d8b25a; margin-bottom: .8rem; display: flex; justify-content: space-between; }
.drawer h2 button { background: none; border: 0; color: #f4ead8; font-size: 1.5rem; cursor: pointer; }
#lines { flex: 1; overflow-y: auto; }
.line { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #d8b25a; background: none; color: #f4ead8; cursor: pointer; }
.total { font-size: 1.2rem; margin: .8rem 0; display: flex; justify-content: space-between; }
form { display: grid; gap: .6rem; }
input, select, textarea { padding: .6rem; border-radius: 8px; border: 1px solid rgba(216,178,90,.5); background: #120c08; color: #f4ead8; font: inherit; }
.ok { margin-top: .8rem; color: #f0d98a; }
.resa { max-width: 420px; margin: 0 auto; }
.types { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0; }
.type { border: 1px solid rgba(216,178,90,.5); background: transparent; color: inherit; font: inherit; font-size: .9rem; padding: .4rem .8rem; border-radius: 20px; cursor: pointer; }
.type small { opacity: .7; margin-left: .3rem; }
.type.on { background: var(--c); border-color: var(--c); color: #fff; }
@keyframes up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
</style>

const tabs = document.getElementById("tabs");
const plats = document.getElementById("plats");
const carte = document.getElementById("carte");

tabs.innerHTML = COUNTRIES.map((c) =>
  `<button class="tab" data-id="${c.id}"><img src="https://flagcdn.com/w80/${c.code}.png" alt=""><span>${c.nom}</span></button>`).join("");

function loadPhoto(img) {
  const srcs = JSON.parse(img.dataset.s), wrap = img.parentElement;
  let n = 0;
  (function next() {
    if (n >= srcs.length) { wrap.classList.add("nophoto"); img.remove(); return; }
    const src = srcs[n++];
    img.onerror = next;
    img.onload = () => { wrap.querySelector(".credit").hidden = !/wikimedia/.test(src); };
    img.src = src;
  })();
}

function show(id) {
  const c = COUNTRIES.find((x) => x.id === id);
  carte.style.setProperty("--c", c.couleur);
  tabs.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.id === id));
  document.getElementById("banner").innerHTML = `<img src="https://flagcdn.com/w320/${c.code}.png" alt=""><div><h3>${c.nom}</h3><p>${c.slogan}</p></div>`;
  plats.innerHTML = c.plats.map((p, i) => {
    const key = `${c.id}-${p.slug}`;
    const srcs = [PHOTOS[key], EMBEDDED[key], `photos/${key}.jpg`, p.photo].filter(Boolean);
    return `<article class="plat" style="--d:${i * 0.1}s">
      <div class="photo"><img class="pimg" alt="${p.nom}" data-s='${JSON.stringify(srcs)}'><span class="emoji">${p.emoji}</span><span class="credit" hidden>Photo : Wikimedia Commons</span></div>
      <div class="txt"><h3>${p.nom}</h3><p>${p.desc}</p>
        ${p.histoire ? `<div class="story"><b>L9issa</b><p>${p.histoire}</p></div>` : ""}
        ${p.types ? `<div class="types">${p.types.map((t, j) => `<button class="type${j ? "" : " on"}" data-t="${j}" data-p="${t.prix}">${t.nom}<small>${t.prix} DH</small></button>`).join("")}</div>` : ""}
        <div class="bas"><span class="prix">${p.prix} DH</span><button data-k="${c.id}:${i}">Ajouter</button></div></div>
    </article>`; }).join("");
  plats.querySelectorAll(".pimg").forEach(loadPhoto);
}
tabs.addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (t) { show(t.dataset.id); document.getElementById("banner").scrollIntoView({ behavior: "smooth", block: "start" }); } });
const wanted = new URLSearchParams(location.search).get("c");
show(COUNTRIES.some((x) => x.id === wanted) ? wanted : COUNTRIES[0].id);

// ===== panier =====
const $ = (id) => document.getElementById(id);
const cart = {};
function find(k) {
  const [id, i, t] = k.split(":");
  const p = COUNTRIES.find((c) => c.id === id).plats[+i];
  const ty = p.types && p.types[+t || 0];
  return { nom: ty ? p.nom + " — " + ty.nom : p.nom, prix: ty ? ty.prix : p.prix, emoji: p.emoji };
}
function renderCart() {
  const keys = Object.keys(cart);
  $("count").textContent = keys.reduce((n, k) => n + cart[k], 0);
  $("lines").innerHTML = keys.length ? keys.map((k) => { const p = find(k);
    return `<div class="line"><div>${p.emoji} ${p.nom}<br><small>${p.prix} DH</small></div>
      <div class="qty"><button data-k="${k}" data-d="-1">−</button> ${cart[k]} <button data-k="${k}" data-d="1">+</button></div></div>`; }).join("")
    : "<p>Panier khawi 🍽️</p>";
  $("total").textContent = keys.reduce((s, k) => s + find(k).prix * cart[k], 0) + " DH";
}
plats.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const k = b.dataset.k + ":" + (b.closest(".plat").dataset.t || 0);
  cart[k] = (cart[k] || 0) + 1; renderCart();
  $("orderOk").textContent = ""; $("drawer").classList.add("open");
});
plats.addEventListener("click", (e) => {
  const t = e.target.closest(".type"); if (!t) return;
  const art = t.closest(".plat");
  art.querySelectorAll(".type").forEach((x) => x.classList.toggle("on", x === t));
  art.dataset.t = t.dataset.t;
  art.querySelector(".prix").textContent = t.dataset.p + " DH";
});
$("lines").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  cart[b.dataset.k] += +b.dataset.d; if (cart[b.dataset.k] <= 0) delete cart[b.dataset.k]; renderCart();
});
$("cartBtn").addEventListener("click", () => $("drawer").classList.add("open"));
$("closeCart").addEventListener("click", () => $("drawer").classList.remove("open"));
$("orderForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!Object.keys(cart).length) { $("orderOk").textContent = "Zid chi plat l'panier 9bl."; return; }
  $("orderOk").textContent = `Merci ${$("oNom").value}! Commande reçue (${$("total").textContent}). Ghadi n3ayto 3lik 3la ${$("oTel").value}.`;
  Object.keys(cart).forEach((k) => delete cart[k]); renderCart(); e.target.reset();
});
$("resaForm").addEventListener("submit", (e) => {
  e.preventDefault();
  $("resaOk").textContent = `Merci ${$("rNom").value}! Tabla l ${$("rPers").value} nhar ${$("rDate").value} f ${$("rHeure").value} tsjlat ✅`;
  e.target.reset();
});
renderCart();
</script>

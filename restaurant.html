<title>Jeddour's Table — Restaurant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:Georgia,serif;color:#f4ead8;text-align:center;background:#120c08}
h1{font-size:2.3rem;letter-spacing:2px;color:#d8b25a}
.nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;padding:.7rem 1.5rem;background:rgba(18,12,8,.95);border-bottom:1px solid rgba(216,178,90,.25)}
.brand{display:flex;align-items:center;gap:.6rem;color:#d8b25a;text-decoration:none;font-size:1.2rem}
.brand svg{width:44px;height:44px}
.nav nav{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.nav nav a{color:#f4ead8;text-decoration:none}.nav nav a:hover{color:#d8b25a}
.hero2{padding:6rem 1rem 5rem;background:radial-gradient(circle at 50% 0,#4a2d1b,#120c08 70%)}
.hero2 h1{font-size:3.2rem}.hero2 p{margin:.8rem 0 1.6rem;opacity:.85}
.btn{display:inline-block;background:#d8b25a;color:#2a1a0c;padding:.8rem 1.8rem;border-radius:30px;text-decoration:none;font-weight:bold;border:0;cursor:pointer;font:inherit;font-weight:bold}
.bloc{max-width:1000px;margin:0 auto;padding:3.5rem 1rem;scroll-margin-top:80px}
#carte{max-width:1100px}
.bloc h2,footer h2{color:#d8b25a;font-size:2rem;margin-bottom:1.2rem}
.tabs{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1rem 0 1.5rem}
.tab{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;border-radius:30px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:inherit;cursor:pointer;transition:background .3s}
.tab img{width:26px;height:18px;object-fit:cover;border-radius:3px}
.tab.on{background:var(--c,#d8b25a);border-color:var(--c,#d8b25a)}
.filtres{max-width:640px;margin:0 auto 1.5rem}
#recherche{width:100%;padding:.8rem 1.2rem;border-radius:30px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.8rem}
.chip{padding:.4rem .9rem;border-radius:20px;border:1px solid rgba(216,178,90,.5);background:transparent;color:inherit;font:inherit;cursor:pointer}
.chip.on{background:#d8b25a;color:#2a1a0c;font-weight:bold}
#aucun{margin-top:1rem;opacity:.8}
.banner{display:flex;align-items:center;gap:1.2rem;justify-content:center;padding:1.5rem;margin-bottom:1.5rem;border-radius:18px;background:linear-gradient(120deg,var(--c),#1f1510 90%);scroll-margin-top:80px}
.banner img{width:120px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.banner h3{font-size:2.2rem;color:#fff}.banner p{opacity:.9;font-style:italic}
.plats{display:grid;gap:1.8rem;margin:1.5rem auto}
.plat{display:grid;grid-template-columns:1.1fr 1fr;background:#1f1510;border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;text-align:start;opacity:0;animation:up .6s forwards;animation-delay:var(--d)}
.plat:nth-child(even) .photo{order:2}
.photo{position:relative;min-height:320px;background:linear-gradient(135deg,var(--c),#2a170d)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .emoji{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:6rem}
.photo.nophoto .emoji{display:flex}
.credit{position:absolute;right:8px;bottom:6px;font-size:.7rem;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.heart.on{color:#ff5a6e}
.txt{padding:1.6rem;display:flex;flex-direction:column;gap:.6rem}
.plat h3{font-size:1.7rem;color:#f0d98a}.plat p{opacity:.85}
.story{padding:.9rem 1rem;border-inline-start:3px solid var(--c);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0;font-style:italic}
.story b{display:block;font-style:normal;color:#d8b25a;margin-bottom:.3rem}
.types{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.type{border:1px solid rgba(216,178,90,.5);background:transparent;color:inherit;font:inherit;font-size:.9rem;padding:.4rem .8rem;border-radius:20px;cursor:pointer}
.type small{opacity:.7;margin-inline-start:.3rem}
.type.on{background:var(--c,#d8b25a);border-color:var(--c,#d8b25a);color:#fff}
.bas{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.prix{font-weight:bold;font-size:1.1rem}
.bas button{background:var(--c,#d8b25a);color:#fff;border:0;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font:inherit}
@media(max-width:760px){.plat{grid-template-columns:1fr}.plat:nth-child(even) .photo{order:0}.photo{min-height:220px}.banner{flex-direction:column;text-align:center}}
footer{padding:2.5rem 1rem;border-top:1px solid rgba(216,178,90,.25)}footer p{margin:.3rem 0}
.cartbtn{background:#d8b25a;color:#2a1a0c;border:0;border-radius:20px;padding:.5rem 1rem;font:inherit;font-weight:bold;cursor:pointer}
.drawer{position:fixed;top:0;right:0;width:min(380px,100vw);height:100%;background:#1a110c;border-left:1px solid rgba(216,178,90,.4);z-index:30;padding:1.2rem;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .4s;text-align:start;overflow-y:auto}
.drawer.open{transform:none}
.drawer h2{color:#d8b25a;margin-bottom:.8rem;display:flex;justify-content:space-between}
.drawer h2 button{background:none;border:0;color:#f4ead8;font-size:1.5rem;cursor:pointer}
#lines{flex:1;min-height:60px}
.line{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.1)}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid #d8b25a;background:none;color:#f4ead8;cursor:pointer}
.total{font-size:1.2rem;margin:.6rem 0;display:flex;justify-content:space-between}
#recap{font-size:.9rem;opacity:.85;margin:.4rem 0}
.row{display:flex;gap:.5rem;margin-bottom:.4rem}
form{display:grid;gap:.6rem}
input,select,textarea{padding:.6rem;border-radius:8px;border:1px solid rgba(216,178,90,.5);background:#120c08;color:#f4ead8;font:inherit}
.ok{margin-top:.8rem;color:#f0d98a}
.resa{max-width:420px;margin:0 auto}
.steps{display:flex;gap:6px;margin:1rem 0}
.step{flex:1;padding-top:.6rem;border-top:5px solid rgba(255,255,255,.15);font-size:.85rem;opacity:.6}
.step.on{border-color:#d8b25a;opacity:1;font-weight:bold}
#admin{max-width:1100px}
.apane{overflow-x:auto;text-align:start;margin-top:1rem}
.apane table{width:100%;border-collapse:collapse;font-size:.9rem}
.apane th,.apane td{padding:.5rem;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1rem}
.stat{background:#1f1510;border:1px solid rgba(216,178,90,.3);border-radius:12px;padding:1rem}
.stat b{display:block;font-size:1.6rem;color:#d8b25a}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
</style>
</head>

<section class="hero2" id="top">
  <h1>Jeddour's Table</h1>
  <p data-i="hero_p"></p>
  <a href="#carte" class="btn" data-i="hero_btn"></a>
</section>

<section class="bloc" id="carte">
  <h2 data-i="menu_h"></h2>

  <div class="filtres">
    <input type="search" id="recherche" data-p="search">
    <div class="chips">
      <button class="chip on" data-f="tous" data-i="f_all"></button>
      <button class="chip" data-f="halal" data-i="f_halal"></button>
      <button class="chip" data-f="vege" data-i="f_vege"></button>
      <button class="chip" data-f="sans-gluten" data-i="f_gf"></button>
      <button class="chip" data-f="piquant" data-i="f_spicy"></button>
      <button class="chip" data-f="fav" data-i="f_fav"></button>
    </div>
    <p id="aucun" hidden data-i="none"></p>
  </div>
  <div class="banner" id="banner"></div>
  <div class="plats" id="plats"></div>
</section>

<section class="bloc" id="reservation">
  <h2 data-i="book_h"></h2>
  <form class="resa" id="resaForm">
    <input id="rNom" data-p="name" required>
    <input id="rTel" data-p="phone" inputmode="tel" required>

    <input id="rHeure" type="time" required>
    <select id="rPers"></select>
    <p class="ok" id="rInfo"></p>
    <button class="btn" data-i="book_btn"></button>
  </form>
  <p class="ok" id="resaOk"></p>
</section>

<section class="bloc" id="suivi">
  <h2 data-i="track_h"></h2>
  <form class="resa" id="suiviForm">
    <input id="sNum" placeholder="YJ-0000" required>
    <button class="btn" data-i="track_btn"></button>
  </form>
  <div id="sRes"></div>
</section>

<section class="bloc" id="admin" hidden>
  <h2>Admin</h2>
  <div class="stats" id="a-stats"></div>
  <h3>Commandes</h3><div class="apane" id="a-cmd"></div>
  <h3 style="margin-top:2rem">Réservations</h3><div class="apane" id="a-res"></div>
</section>

<footer id="contact">
  <h2 data-i="contact_h"></h2>
  <p data-i="hours"></p><p data-i="address"></p><p data-i="tel"></p>
</footer>

<aside class="drawer" id="drawer">
  <h2><span data-i="cart_h"></span><button id="closeCart">×</button></h2>
  <div id="lines"></div>
  <div class="row"><input id="promoIn" data-p="promo" style="flex:1"><button class="chip" id="promoBtn" data-i="apply"></button></div>
  <p class="ok" id="promoMsg" style="margin:0"></p>
  <p id="recap"></p>
  <div class="total"><span data-i="total"></span><strong id="total">0 DH</strong></div>
  <form id="orderForm">
    <input id="oNom" data-p="name" required>
    <input id="oTel" data-p="phone" inputmode="tel" required>
    <textarea id="oAdr" data-p="addr" required rows="2"></textarea>
    <button class="btn" data-i="order_btn"></button>
  </form>
  <p class="ok" id="orderOk"></p>
</aside>

function loadPhoto(img, srcs) {
  const wrap = img.parentElement; let n = 0;
  (function next() {
    if (n >= srcs.length) { wrap.classList.add("nophoto"); img.remove(); return; }
    const src = srcs[n++]; img.onerror = next;
    img.onload = () => { wrap.querySelector(".credit").hidden = !/wikimedia/.test(src); };
    img.src = src;
  })();
}

  if (filtre === "fav") return favs.includes(key);
  return (TAGS[key] || "").split(" ").includes(filtre);
}

$("#plats").addEventListener("click", (e) => {
  const h = e.target.closest(".heart");
  if (h) { const k = h.dataset.fav; favs = favs.includes(k) ? favs.filter((x) => x !== k) : [...favs, k]; sv("yj_favs", favs); h.classList.toggle("on"); if (filtre === "fav") show(current); return; }
  const ty = e.target.closest(".type");
  if (ty) { const art = ty.closest(".plat"); art.querySelectorAll(".type").forEach((x) => x.classList.toggle("on", x === ty)); art.dataset.t = ty.dataset.t; art.querySelector(".prix").textContent = ty.dataset.p + " DH"; return; }
  const b = e.target.closest("button[data-k]");
  if (b) { const k = b.dataset.k + ":" + (b.closest(".plat").dataset.t || 0); cart[k] = (cart[k] || 0) + 1; renderCart(); $("#orderOk").innerHTML = ""; $("#drawer").classList.add("open"); }
});

/* ---------- Panier ---------- */
function find(k) {
  const [id, i, t] = k.split(":"), p = COUNTRIES.find((c) => c.id === id).plats[+i], ty = p.types && p.types[+t || 0];
  return { nom: ty ? p.nom + " — " + ty.nom : p.nom, prix: ty ? ty.prix : p.prix, emoji: p.emoji };
}
function calc() {
  const sous = Object.keys(cart).reduce((s, k) => s + find(k).prix * cart[k], 0);
  const remise = promo ? Math.round(sous * 0.1) : 0;
  const livr = sous === 0 ? 0 : (sous - remise >= 200 ? 0 : 20);
  return { sous, remise, livr, total: sous - remise + livr };
}
function renderCart() {
  const keys = Object.keys(cart), t = T[lang], r = calc();
  $("#count").textContent = keys.reduce((n, k) => n + cart[k], 0);
  $("#lines").innerHTML = keys.length ? keys.map((k) => { const p = find(k);
    return `<div class="line"><div>${p.emoji} ${p.nom}<br><small>${p.prix} DH</small></div><div class="qty"><button data-k="${k}" data-d="-1">−</button> ${cart[k]} <button data-k="${k}" data-d="1">+</button></div></div>`; }).join("") : `<p>${t.empty}</p>`;
  $("#recap").innerHTML = keys.length ? `${t.sub} : ${r.sous} DH` + (r.remise ? `<br>${t.disc} : −${r.remise} DH` : "") + `<br>${t.deliv} : ${r.livr ? r.livr + " DH" : t.free}` : "";
  $("#total").textContent = r.total + " DH";
}
$("#lines").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  cart[b.dataset.k] += +b.dataset.d; if (cart[b.dataset.k] <= 0) delete cart[b.dataset.k]; renderCart();
});
$("#cartBtn").onclick = () => $("#drawer").classList.add("open");
$("#closeCart").onclick = () => $("#drawer").classList.remove("open");
$("#promoBtn").onclick = () => { promo = $("#promoIn").value.trim().toUpperCase() === PROMO; $("#promoMsg").textContent = promo ? T[lang].promo_ok : T[lang].promo_bad; renderCart(); };
$("#orderForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const keys = Object.keys(cart);
  if (!keys.length) { $("#orderOk").textContent = T[lang].need; return; }
  const r = calc(), num = "YJ-" + Math.floor(1000 + Math.random() * 9000);
  const lignes = keys.map((k) => ({ nom: find(k).nom, qty: cart[k], prix: find(k).prix }));
  const o = ls("yj_orders", []);
  o.push({ num, nom: $("#oNom").value, tel: $("#oTel").value, adr: $("#oAdr").value, total: r.total, statut: 0, date: new Date().toLocaleString("fr-FR"), lignes });
  sv("yj_orders", o);
  const msg = `Commande ${num}\n${$("#oNom").value} - ${$("#oTel").value}\n${$("#oAdr").value}\n` + lignes.map((l) => `${l.qty}x ${l.nom} (${l.prix} DH)`).join("\n") + `\nTotal: ${r.total} DH`;
  $("#orderOk").innerHTML = `${T[lang].order_ok} <b>${num}</b><br><a class="btn" style="margin-top:.6rem;padding:.5rem 1rem" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">${T[lang].wa}</a>`;
  keys.forEach((k) => delete cart[k]); promo = false; $("#promoMsg").textContent = ""; renderCart(); e.target.reset(); renderAdmin();
});

/* ---------- Suivi ---------- */
$("#suiviForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const o = ls("yj_orders", []).find((x) => x.num === $("#sNum").value.trim().toUpperCase());
  $("#sRes").innerHTML = o ? `<p style="margin-top:1rem"><b>${esc(o.num)}</b> — ${o.total} DH</p><div class="steps">${T[lang].st.map((s, i) => `<div class="step${i <= o.statut ? " on" : ""}">${s}</div>`).join("")}</div>` : `<p class="ok">${T[lang].nf}</p>`;
});

/* ---------- Réservation (10 tables x 4) ---------- */
$("#rDate").min = new Date().toISOString().slice(0, 10);
function placesRestantes() {
  const pris = ls("yj_resa", []).filter((r) => r.date === $("#rDate").value && r.heure === $("#rHeure").value && r.statut !== "Refusée").reduce((s, r) => s + r.pers, 0);
  return CAPACITE - pris;
}
function majInfo() { $("#rInfo").textContent = $("#rDate").value && $("#rHeure").value ? `${T[lang].left} : ${placesRestantes()} / ${CAPACITE}` : ""; }
["#rDate", "#rHeure"].forEach((s) => $(s).addEventListener("change", majInfo));
$("#resaForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const pers = +$("#rPers").value;
  if (pers > placesRestantes()) { $("#resaOk").textContent = T[lang].full; return; }
  const r = ls("yj_resa", []);
  r.push({ id: Date.now(), nom: $("#rNom").value, tel: $("#rTel").value, date: $("#rDate").value, heure: $("#rHeure").value, pers, statut: "En attente" });
  sv("yj_resa", r);
  $("#resaOk").textContent = `${$("#rNom").value} · ${pers} · ${$("#rDate").value} ${$("#rHeure").value} — ${T[lang].book_ok}`;
  e.target.reset(); majInfo(); renderAdmin();
});

/* ---------- Admin (protégé par PIN) ---------- */
$("#adminBtn").addEventListener("click", (e) => {
  e.preventDefault();
  const s = $("#admin");
  if (!s.hidden) { s.hidden = true; return; }
  if (prompt("PIN ?") !== ADMIN_PIN) return;
  s.hidden = false; renderAdmin(); s.scrollIntoView({ behavior: "smooth" });
});
function renderAdmin() {
  const o = ls("yj_orders", []), r = ls("yj_resa", []), st = T[lang].st, compte = {};
  o.forEach((x) => x.lignes.forEach((l) => compte[l.nom] = (compte[l.nom] || 0) + l.qty));
  const top = Object.entries(compte).sort((a, b) => b[1] - a[1])[0];
  $("#a-stats").innerHTML = `<div class="stat"><b>${o.length}</b>Commandes</div><div class="stat"><b>${o.reduce((s, x) => s + x.total, 0)} DH</b>Revenus</div><div class="stat"><b>${r.length}</b>Réservations</div><div class="stat"><b>${top ? esc(top[0]) : "—"}</b>Top plat</div>`;
  $("#a-cmd").innerHTML = o.length ? "<table><tr><th>N°</th><th>Client</th><th>Détail</th><th>Total</th><th>Statut</th></tr>" + o.slice().reverse().map((x) => `<tr><td>${esc(x.num)}<br><small>${esc(x.date)}</small></td><td>${esc(x.nom)}<br>${esc(x.tel)}<br>${esc(x.adr)}</td><td>${x.lignes.map((l) => l.qty + "× " + esc(l.nom)).join("<br>")}</td><td>${x.total} DH</td><td><select data-o="${esc(x.num)}">${st.map((s, i) => `<option value="${i}"${i === x.statut ? " selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("") + "</table>" : "<p>Aucune commande.</p>";
  $("#a-res").innerHTML = r.length ? "<table><tr><th>Client</th><th>Date</th><th>Pers.</th><th>Statut</th><th></th></tr>" + r.slice().reverse().map((x) => `<tr><td>${esc(x.nom)}<br>${esc(x.tel)}</td><td>${esc(x.date)} ${esc(x.heure)}</td><td>${x.pers}</td><td>${x.statut}</td><td><button class="chip" data-r="${x.id}" data-s="Confirmée">✔</button> <button class="chip" data-r="${x.id}" data-s="Refusée">✖</button></td></tr>`).join("") + "</table>" : "<p>Aucune réservation.</p>";
}
$("#a-cmd").addEventListener("change", (e) => { if (!e.target.dataset.o) return; const o = ls("yj_orders", []), x = o.find((y) => y.num === e.target.dataset.o); if (x) x.statut = +e.target.value; sv("yj_orders", o); renderAdmin(); });
$("#a-res").addEventListener("click", (e) => { const b = e.target.closest("[data-r]"); if (!b) return; const r = ls("yj_resa", []), x = r.find((y) => y.id === +b.dataset.r); if (x) x.statut = b.dataset.s; sv("yj_resa", r); renderAdmin(); majInfo(); });

/* ---------- Langue : appliquer ---------- */
function setLang(l) {
  if (!T[l]) l = "fr";
  lang = l; try { localStorage.setItem("lang", l); } catch (e) {}
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $$("[data-i]").forEach((el) => { if (T[l][el.dataset.i] !== undefined) el.textContent = T[l][el.dataset.i]; });
  $$("[data-p]").forEach((el) => el.placeholder = T[l][el.dataset.p]);
  const sel = $("#rPers"), keep = sel.value || "2";
  sel.innerHTML = [1, 2, 3, 4, 5, 6, 8].map((n) => `<option value="${n}">${n} ${n === 1 ? T[l].p1 : T[l].pN}</option>`).join(""); sel.value = keep;
  $("#langSel").value = l;
  show(current); renderCart(); majInfo(); renderAdmin();
}
$("#langSel").addEventListener("change", (e) => setLang(e.target.value));

/* ---------- Démarrage ---------- */
const params = new URLSearchParams(location.search);
if (COUNTRIES.some((x) => x.id === params.get("c"))) current = params.get("c");
setLang(params.get("lang") || localStorage.getItem("lang") || "fr");
</script>
</body>
</html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; font-family: Georgia, serif; color: #f4ead8; text-align: center;
  background: radial-gradient(circle at 50% 20%, #3a2417, #0c0705 70%); padding: 1.5rem 1rem 3rem; overflow-x: hidden; }
body::after { content: ""; position: fixed; inset: 0; box-shadow: inset 0 0 220px 70px #000; pointer-events: none; z-index: 3; }
main { position: relative; z-index: 2; min-height: calc(100vh - 4.5rem); display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 2.3rem; letter-spacing: 2px; color: #d8b25a; margin-top: .3rem; }
#dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.spot { position: fixed; top: -10%; left: 50%; width: 80vmin; height: 120vh; transform: translateX(-50%);
  background: linear-gradient(180deg, rgba(255,214,140,.3), transparent 75%);
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); filter: blur(18px);
  opacity: 0; animation: fadeIn 2.5s 1s forwards; pointer-events: none; z-index: 1; }
.flash { position: fixed; inset: 0; background: radial-gradient(circle at 50% 45%, #fff3c4, transparent 65%); opacity: 0; pointer-events: none; z-index: 50; }
.flash.go { animation: flash 1.2s; }
.logo { width: 80px; opacity: 0; transform: scale(.6); filter: drop-shadow(0 0 14px #d8b25a); animation: logoIn 1.2s .3s forwards; }
#title { perspective: 600px; }
#title span { display: inline-block; opacity: 0; transform: translateY(30px) rotateX(-70deg); animation: letter .8s forwards; animation-delay: calc(1s + var(--i) * .06s); }
.tagline { opacity: 0; letter-spacing: 4px; text-transform: uppercase; font-size: .85rem; margin: .3rem 0 1rem; animation: fadeIn 1.2s 2.4s forwards; }
.scene { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
.tagine { width: min(460px, 88vw); cursor: pointer; opacity: 0; transform: translateY(60px); filter: drop-shadow(0 20px 40px rgba(255,170,80,.25));
  animation: rise 1.4s 2.6s cubic-bezier(.2,.8,.2,1) forwards, float 4s 4.2s ease-in-out infinite; }
.hint { cursor: pointer; opacity: 0; margin: .5rem 0 1.2rem; min-height: 1.5rem; animation: fadeIn 1s 4s forwards; }
.lid { transform-origin: 150px 168px; transition: transform 1.2s cubic-bezier(.6,-.3,.3,1.3), filter .3s; }
.tagine:hover .lid { filter: brightness(1.15); }
.glow { opacity: 0; filter: blur(25px); transition: opacity 1s .3s; }
.steam path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0; }
.steam path:nth-child(2) { animation-delay: .5s !important; }
.steam path:nth-child(3) { animation-delay: 1s !important; }
.scene.open .tagine { animation: none; opacity: 1; transform: none; }
.scene.open .hint { animation: none; opacity: 1; }
.scene.open .lid { transform: translateY(-125px) rotate(-18deg); }
.scene.open .glow { opacity: .8; }
.scene.open .steam path { animation: steam 2.2s infinite; }
.enter { display: block; margin: 0 auto 1.4rem; padding: 1.1rem 2.4rem; border-radius: 18px; text-decoration: none; color: #2a1a0c;
  background: linear-gradient(180deg, #f0d98a, #b98a2e); box-shadow: 0 0 40px rgba(240,217,138,.5), 0 10px 30px rgba(0,0,0,.5);
  opacity: 0; transform: translateY(-45vh) scale(.2); pointer-events: none; transition: opacity .6s, transform 1s cubic-bezier(.3,1.5,.5,1); }
.enter strong { display: block; font-size: 1.5rem; letter-spacing: 2px; }
.enter span { font-size: .85rem; opacity: .8; }
.scene.open ~ .enter { opacity: 1; transform: none; pointer-events: auto; transition-delay: .6s, .6s; animation: glowPulse 2.4s 2s infinite; }
.scene.open ~ .enter:hover { transform: scale(1.06); transition-delay: 0s; }
.countries { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 820px; margin: 0 auto; padding-bottom: 2rem; }
.card { --c: #d8b25a; display: flex; flex-direction: column; align-items: center; gap: .6rem; width: 130px; padding: 1rem .5rem; border-radius: 16px;
  color: inherit; text-decoration: none; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
  opacity: 0; transform: translateY(-55vh) scale(.2); pointer-events: none; transition: opacity .6s, transform 1s cubic-bezier(.3,1.4,.5,1), background .3s, border-color .3s; }
.card img { width: 76px; height: 52px; object-fit: cover; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.scene.open ~ .countries .card { opacity: 1; transform: none; pointer-events: auto; transition-delay: calc(var(--d) + .9s), calc(var(--d) + .9s), 0s, 0s; }
.scene.open ~ .countries .card:hover { background: var(--c); border-color: var(--c); transform: translateY(-6px) scale(1.06); transition-delay: 0s; }
@keyframes glowPulse { 50% { box-shadow: 0 0 80px rgba(240,217,138,.95), 0 10px 30px rgba(0,0,0,.5); } }
.lang { position: fixed; top: 1rem; inset-inline-end: 1rem; z-index: 60; display: flex; gap: .3rem; }
.lang button { background: rgba(0,0,0,.45); color: #f4ead8; border: 1px solid rgba(216,178,90,.5); border-radius: 14px; padding: .3rem .7rem; font: inherit; font-size: .8rem; cursor: pointer; }
.lang button.on { background: #d8b25a; color: #2a1a0c; }
html[dir=rtl] body { font-family: Tahoma, "Segoe UI", Georgia, serif; }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes logoIn { to { opacity: 1; transform: none; } }
@keyframes letter { to { opacity: 1; transform: none; } }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: .9; } 100% { opacity: 0; } }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .5; } 100% { opacity: 0; transform: translateY(-25px); } }
@keyframes pop { to { opacity: 1; transform: none; } }
</style>
</head>

const I18N = {"ui":{"fr":{"tagline":"Voyage culinaire autour du monde","hint":"Touche le tajine pour l'ouvrir 👆","hint2":"Choisis un pays ou clique sur Entrer 👇","enter":"Entrer","enter_sub":"Menu · Commandes · Réservation"},"en":{"tagline":"A culinary journey around the world","hint":"Tap the tajine to open it 👆","hint2":"Pick a country or press Enter 👇","enter":"Enter","enter_sub":"Menu · Orders · Booking"},"ar":{"tagline":"رحلة طهي حول العالم","hint":"المس الطاجين لفتحه 👆","hint2":"اختر بلدًا أو اضغط دخول 👇","enter":"دخول","enter_sub":"القائمة · الطلبات · الحجز"}},"ct":{"en":{"maroc":["Morocco","The table of a thousand and one flavours"],"italie":["Italy","La dolce vita on a plate"],"france":["France","The art of fine cuisine"],"chine":["China","A thousand years of flavour"],"japon":["Japan","The precision of taste"],"turquie":["Turkey","Between East and West"],"inde":["India","A festival of spices"],"mexique":["Mexico","Fiesta on a plate"]},"ar":{"maroc":["المغرب","مائدة ألف نكهة ونكهة"],"italie":["إيطاليا","الحياة الحلوة في طبق"],"france":["فرنسا","فن المطبخ الراقي"],"chine":["الصين","ألف عام من النكهات"],"japon":["اليابان","دقة الذوق"],"turquie":["تركيا","بين الشرق والغرب"],"inde":["الهند","مهرجان من التوابل"],"mexique":["المكسيك","احتفال في طبق"]}}};
const scene = document.getElementById("scene");
const hint = document.getElementById("hint");
const list = document.getElementById("countries");

function openTajine() {
  if (scene.classList.contains("open")) return;
  scene.classList.add("open");
  document.getElementById("flash").classList.add("go");
  ding();
  hint.textContent = U().hint2;
}
document.querySelector(".tagine").addEventListener("click", openTajine);
hint.addEventListener("click", openTajine);

let lang = new URLSearchParams(location.search).get("lang");
try { lang = lang || localStorage.getItem("lang"); } catch (e) {}
if (!I18N.ui[lang]) lang = "fr";
const U = () => I18N.ui[lang];
const cname = (c) => (lang === "fr" ? c.nom : I18N.ct[lang][c.id][0]);
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  document.getElementById("tagline").textContent = U().tagline;
  hint.textContent = scene.classList.contains("open") ? U().hint2 : U().hint;
  document.getElementById("enterT").textContent = U().enter;
  document.getElementById("enterS").textContent = U().enter_sub;
  document.getElementById("enter").href = "restaurant.html?lang=" + lang;
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  list.innerHTML = COUNTRIES.map((c, i) =>
    `<a class="card" style="--c:${c.couleur};--d:${i * 0.12}s" href="restaurant.html?c=${c.id}&lang=${lang}#carte"><img src="https://flagcdn.com/w160/${c.code}.png" alt=""><span>${cname(c)}</span></a>`).join("");
}
document.getElementById("lang").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { lang = b.dataset.l; applyLang(); } });
applyLang();

const title = document.getElementById("title");
title.innerHTML = [...title.textContent].map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : ch}</span>`).join("");

const cv = document.getElementById("dust");
const ctx = cv.getContext("2d");
const dots = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
size();
addEventListener("resize", size);
for (let i = 0; i < 70; i++) dots.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2 + 0.5, v: Math.random() * 0.4 + 0.15, a: Math.random() });
(function loop() {
  if (ctx) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const d of dots) {
      d.y -= d.v; d.x += Math.sin(d.y / 40) * 0.3;
      if (d.y < -5) { d.y = cv.height + 5; d.x = Math.random() * cv.width; }
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283);
      ctx.fillStyle = `rgba(255,200,110,${d.a * 0.6})`; ctx.fill();
    }
  }
  requestAnimationFrame(loop);
})();
function ding() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.1;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.5);
    });
  } catch (e) {}
}
